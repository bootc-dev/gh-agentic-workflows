name: Maintain gh-aw workflows

# This is a plain (non-gh-aw) workflow: it maintains compiler-owned artifacts
# using the gh-aw version selected by this package release. `gh aw upgrade`
# also applies dispatcher updates and codemods to authored Markdown workflows,
# so its PR needs a full diff review, especially in consumers with frontmatter customizations. No
# fork-guard or bot-role check is needed here —
# schedule/workflow_dispatch events only ever run in this repo's own
# context, with no untrusted event payload to gate against.
#
# Renovate must not touch .github/workflows/*.lock.yml or
# .github/aw/actions-lock.json directly (see README's Roadmap) — those
# files are compiler output, and this workflow is the intended,
# compiler-aware way they change. The App used below already needs
# `workflows: write` on its installation, same as drafter.md/fix.md
# already require to push lock-file changes (see README's setup
# checklist).

on:
  schedule:
    - cron: "25 7 * * 1"  # Weekly, Monday 07:25 UTC; avoids the hourly stampede.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# aw.yml cannot include arbitrary resources with gh-aw v0.86.2. Keep this
# embedded pin synchronized with .github/aw/gh-aw-version (tested locally).
env:
  GH_AW_VERSION: v0.86.2

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_AW_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_AW_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install the package-selected gh-aw version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: node {0}
        run: |
          const { execFileSync, spawnSync } = require("node:child_process");
          const { mkdirSync, writeFileSync } = require("node:fs");

          const expected = process.env.GH_AW_VERSION;
          execFileSync("gh", ["extension", "install", "github/gh-aw", "--pin", expected, "--force"], {
            stdio: "inherit",
          });
          const result = spawnSync("gh", ["aw", "version"], { encoding: "utf8" });
          if (result.error) throw result.error;
          if (result.status !== 0) throw new Error(`gh aw version exited with status ${result.status}`);
          const output = `${result.stdout}${result.stderr}`.replace(/\r?\n$/, "");
          if (output !== `gh aw version ${expected}`) {
            throw new Error(`installed gh-aw output ${JSON.stringify(output)}, expected gh aw version ${expected}`);
          }
          mkdirSync(".github/aw", { recursive: true });
          writeFileSync(".github/aw/gh-aw-version", `${expected}\n`);

      - name: Update action-version pins and recompile all workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # --no-compile: compile as its own step below, so a failure there
          # is clearly attributable to compilation, not the upgrade itself.
          gh aw upgrade --skip-extension-upgrade --no-compile --approve
          # No workflow-id arguments, unlike ci.yml/justfile: compiles every
          # .md file under .github/workflows, so a new pipeline stage never
          # needs this workflow updated to know about it.
          gh aw compile --approve

      - name: Open or update a pull request with the results
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Already up to date, no workflow maintenance needed."
            exit 0
          fi

          branch="automation/maintain-gh-aw-workflows"
          title="build: Maintain gh-aw workflow artifacts"
          body="$(cat <<EOF
          Automated upgrade, opened by \`.github/workflows/upgrade.yml\`:

          - Ensured \`.github/aw/gh-aw-version\` records this package's selected \`${GH_AW_VERSION}\` compiler.
          - Refreshed action-version pins in \`.github/aw/actions-lock.json\`.
          - Recompiled all \`*.lock.yml\` files against the new version.

          Review the full diff before merging: \`gh aw upgrade\` can apply
          dispatcher updates and codemods to authored \`*.md\` workflows, not
          just regenerate compiler-owned files. Retain any consumer-specific
          frontmatter customizations deliberately.
          EOF
          )"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git commit -m "$title"
          git push --force-with-lease origin "$branch"

          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
            echo "Updated existing PR #${existing}"
          else
            gh pr create --title "$title" --body "$body" --head "$branch"
          fi
