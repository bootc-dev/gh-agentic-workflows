name: Check lock drift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# This is a plain (non-gh-aw) workflow: checks that compiled .lock.yml files
# are up to date with their .md sources.
jobs:
  check-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test workflow rerun safe output
        run: |
          node --check .github/workflows/shared/workflow-rerun.cjs
          node --check tests/workflow-rerun.test.js
          node tests/workflow-rerun.test.js

      - name: Install gh-aw extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh extension install github/gh-aw --pin "$(cat .github/aw/gh-aw-version)"

      - name: Compile workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh aw compile drafter review fix queue-triage ci-triage --approve

      - name: Check for lock drift
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/workflows/ || {
            echo "::error::Compiled .lock.yml files are out of sync with their .md sources — run 'just setup && just compile' locally and commit the result."
            exit 1
          }
